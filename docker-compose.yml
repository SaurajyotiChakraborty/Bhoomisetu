
services:
  # PostgreSQL with PostGIS extension for spatial data (Parcels)
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: bhoomisetu_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bhoomisetu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhoomisetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Job Queues (BullMQ) and Session Caching
  redis:
    image: redis:7-alpine
    container_name: bhoomisetu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible File Storage (Uploads, DSC signatures)
  minio:
    image: elestio/minio:latest
    container_name: bhoomisetu_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web Console Port
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bhoomisetu Next.js Web Application (Standalone Production Container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhoomisetu_app
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://postgres:password@db:5432/bhoomisetu
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_BUCKET=bhoomisetu-parcels
      - S3_REGION=us-east-1
      - JWT_SECRET=bhoomisetu-demo-secret-key-2026-production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
